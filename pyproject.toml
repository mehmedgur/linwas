[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linwas"
version = "2.0.0.dev0"
description = "Windows'tan Linux'a geçenler için terminalsiz Linux yardımcısı"
readme = "README.md"
# Geliştirme makinelerinde (Ubuntu 22.04) Python 3.10 var; paket kendi Python 3.12'sini gömer.
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
linwas = "linwas.app:main"

[tool.setuptools.packages.find]
include = ["linwas*"]

[tool.setuptools.package-data]
linwas = ["i18n/*.qm", "i18n/*.ts", "resources/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
