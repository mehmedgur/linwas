name: Yayın

# Sürüm .deb'ini depo adresi + imza anahtarıyla derler ve imzalı APT deposunu üretir.
# Depo artifact olarak yüklenir; yayın yeri (bkz. docs/yapilacaklar.md) kararlaştırılınca
# yükleme adımı eklenecek.
# Gerekenler: gizli değer LINWAS_SIGNING_KEY (packaging/create-signing-key.sh çıktısı),
#             depo değişkeni LINWAS_APT_URL (ör. https://.../apt).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Paket sürümü (ör. 2.0.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: İmzalı .deb ve APT deposu
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      LINWAS_APT_URL: ${{ vars.LINWAS_APT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gereklilikleri denetle
        env:
          SIGNING_KEY: ${{ secrets.LINWAS_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::LINWAS_SIGNING_KEY gizli değeri yok"; exit 1; }
          [ -n "$LINWAS_APT_URL" ] || { echo "::error::LINWAS_APT_URL değişkeni yok"; exit 1; }
      - name: İmza anahtarını içeri al
        env:
          SIGNING_KEY: ${{ secrets.LINWAS_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          FPR=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
          echo "SIGNING_FPR=$FPR" >> "$GITHUB_ENV"
          # Pakete giren açık anahtar her zaman imzalayan anahtarla aynı olsun.
          gpg --batch --export "$FPR" > packaging/linwas-archive-keyring.gpg
      # LibreOffice: Office görünümü paketinin derleme denetimi (sade şerit üretimi) için.
      - run: sudo apt-get update && sudo apt-get install -y apt-utils fakeroot python3-uno
          libreoffice-writer libreoffice-calc libreoffice-impress
      # Tam PySide6 yalnızca çeviri derleyicisi (lrelease) için; pakete Essentials girer.
      - run: pip install "PySide6>=6.8,<7"
      - run: sh scripts/compile-translations.sh python
      - run: bash packaging/build-deb.sh "${VERSION#v}"
      # Resmi eklentiler aynı depodan ayrı paketler olarak (kararlar.md › Eklenti mimarisi);
      # eklentinin sürümü kendi VERSION dosyasından.
      - run: bash packaging/plugins/office-look/build-deb.sh "" build
      - run: bash packaging/build-apt-repo.sh "$SIGNING_FPR" build/apt-repo build/linwas_*.deb
          build/linwas-office-look_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linwas-apt-repo
          path: build/apt-repo
          if-no-files-found: error
