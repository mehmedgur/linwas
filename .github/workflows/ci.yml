name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint ve birim testleri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Geliştirme makinesi (Ubuntu 22.04) ile aynı en düşük sürüm.
          python-version: "3.10"
      - run: pip install "ruff==0.16.8" "pytest==9.1.1"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  build-deb:
    name: Geliştirme .deb paketi
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tam PySide6 yalnızca çeviri derleyicisi (lrelease) için; pakete Essentials girer.
      - run: pip install "PySide6>=6.8,<7"
      - run: sh scripts/compile-translations.sh python
      - run: bash packaging/build-deb.sh "2.0.0~dev${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linwas-deb
          path: build/*.deb
          if-no-files-found: error
          retention-days: 14
      # Kurulum testi kapsayıcılarında git yok; test betiği ayrı artifact olarak taşınır.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-scripts
          path: packaging/ci-install-test.sh
          retention-days: 1

  install-test:
    name: Kurulum testi (${{ matrix.image }})
    needs: build-deb
    runs-on: ubuntu-24.04
    # Ubuntu 20.04 ve Debian 11'in glibc'si (2.31) güncel PySide6 için eski; karar bekleniyor.
    continue-on-error: ${{ matrix.legacy }}
    strategy:
      fail-fast: false
      matrix:
        # Pardus 23 = Debian 12 tabanı, Pardus 25 = Debian 13 tabanı.
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "debian:13"]
        legacy: [false]
        include:
          - image: "ubuntu:20.04"
            legacy: true
          - image: "debian:11"
            legacy: true
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linwas-deb
      - uses: actions/download-artifact@v4
        with:
          name: ci-scripts
      - name: Paketi kur ve kendi kendini denetle
        run: bash ci-install-test.sh
