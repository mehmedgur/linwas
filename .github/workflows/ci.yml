name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint ve birim testleri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Geliştirme makinesi (Ubuntu 22.04) ile aynı en düşük sürüm.
          python-version: "3.10"
      - run: pip install "ruff==0.16.8" "pytest==9.1.1"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  build-deb:
    name: Geliştirme .deb paketi
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tam PySide6 yalnızca çeviri derleyicisi (lrelease) için; pakete Essentials girer.
      - run: pip install "PySide6>=6.8,<7"
      - run: sh scripts/compile-translations.sh python
      - run: bash packaging/build-deb.sh "2.0.0~dev${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linwas-deb
          path: build/*.deb
          if-no-files-found: error
          retention-days: 14
      # Test kapsayıcılarında git yok; test betikleri ayrı artifact olarak taşınır
      # (ortak üst klasör packaging/ olduğu için betikler artifact kökünde durur).
      - uses: actions/upload-artifact@v4
        with:
          name: ci-scripts
          path: |
            packaging/ci-install-test.sh
            packaging/ci-apt-repo-test.sh
            packaging/build-apt-repo.sh
            packaging/debian/postinst.in
          retention-days: 1

  office-look:
    name: Office görünümü paketi
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Derleme betiği paket ağacını ve bu LibreOffice'ten üretilen sade şeridi denetler.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libreoffice-writer libreoffice-calc libreoffice-impress python3-uno fakeroot
      - run: bash packaging/plugins/office-look/build-deb.sh
          "$(cat packaging/plugins/office-look/VERSION)~dev${{ github.run_number }}" build
      - uses: actions/upload-artifact@v4
        with:
          name: linwas-office-look-deb
          path: build/linwas-office-look_*.deb
          if-no-files-found: error
          retention-days: 14

  install-test:
    name: Kurulum testi (${{ matrix.image }})
    needs: build-deb
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Desteklenen sistemler. Pardus 23 = Debian 12 tabanı, Pardus 25 = Debian 13 tabanı,
        # Mint 21/22 = Ubuntu 22.04/24.04 tabanı. Ubuntu 20.04 ve Debian 11 desteklenmiyor.
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linwas-deb
      - uses: actions/download-artifact@v4
        with:
          name: ci-scripts
      - name: Paketi kur ve kendi kendini denetle
        run: bash ci-install-test.sh

  apt-repo-test:
    name: APT deposu testi (${{ matrix.image }})
    needs: build-deb
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "debian:12"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linwas-deb
      - uses: actions/download-artifact@v4
        with:
          name: ci-scripts
      - name: İmzalı depo, postinst kaynağı, depodan güncelleme, purge
        run: bash ci-apt-repo-test.sh
